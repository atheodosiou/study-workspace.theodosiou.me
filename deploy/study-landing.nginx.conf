# Initial HTTP configuration. Enable HTTPS after checking the existing VM setup.
server {
    listen 80;
    listen [::]:80;
    server_name study-workspace.theodosiou.me;

    root /var/www/study-landing/current;
    index index.html;

    access_log /var/log/nginx/study-landing.access.log;
    error_log /var/log/nginx/study-landing.error.log;

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }

    location /img/ {
        expires 1d;
        try_files $uri =404;
    }

    location /media/ {
        expires 1d;
        try_files $uri =404;
    }
}
